name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Zip faylni ochish
        run: |
          unzip -o WiFiInfoPro.zip -d extracted
          mv extracted/WiFiInfoPro/* .
          mv extracted/WiFiInfoPro/.[!.]* . 2>/dev/null || true

      - name: Kotlin versiyasini tuzatish
        run: |
          sed -i 's/org.jetbrains.kotlin.android") version "1.9.24"/org.jetbrains.kotlin.android") version "2.0.21"/' build.gradle.kts
          sed -i 's/org.jetbrains.kotlin.plugin.compose") version "1.9.24"/org.jetbrains.kotlin.plugin.compose") version "2.0.21"/' build.gradle.kts

      - name: Kod xatolarini tuzatish
        run: |
          sed -i '/import androidx.compose.runtime.getValue/a import androidx.compose.runtime.setValue' app/src/main/java/com/wifiinfopro/app/MainActivity.kt
          sed -i 's/this.then(androidx.compose.foundation.clickable(onClick = onClick))/this.clickable(onClick = onClick)/' app/src/main/java/com/wifiinfopro/app/ui/screens/SettingsScreen.kt
          sed -i 's/this.then(androidx.compose.foundation.clickable {/this.clickable {/' app/src/main/java/com/wifiinfopro/app/ui/screens/SettingsScreen.kt
          sed -i '103s/^    })$/    }/' app/src/main/java/com/wifiinfopro/app/ui/screens/SettingsScreen.kt
          sed -i '/import androidx.compose.ui.Modifier/a import androidx.compose.foundation.clickable' app/src/main/java/com/wifiinfopro/app/ui/screens/SettingsScreen.kt

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.7 o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gradle wrapper yaratish (agar mavjud bo'lmasa)
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Debug APK yasash
        run: ./gradlew assembleDebug --stacktrace

      - name: APK faylni saqlash (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WiFiInfoPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
